<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPN Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Chakra+Petch:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --calc-bg: #1a1a1e;
    --bezel: #2a2a30;
    --bezel-edge: #3a3a42;
    --display-bg: #0a1a0a;
    --display-glow: #33ff66;
    --display-dim: #1a7733;
    --btn-num: #3a3a44;
    --btn-num-hover: #4a4a55;
    --btn-op: #4a3a2a;
    --btn-op-hover: #5a4a3a;
    --btn-enter: #2a4a3a;
    --btn-enter-hover: #3a5a4a;
    --btn-func: #2a2a3a;
    --btn-func-hover: #3a3a4a;
    --btn-clear: #5a2a2a;
    --btn-clear-hover: #6a3a3a;
    --btn-text: #e0e0e0;
    --btn-label: #aaa;
    --accent: #ff8844;
    --shadow: rgba(0,0,0,0.5);
  }

  body {
    background: #111114;
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(51,255,102,0.03) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(255,136,68,0.03) 0%, transparent 60%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Chakra Petch', sans-serif;
    color: #ccc;
  }

  .calculator {
    background: var(--calc-bg);
    border: 1px solid var(--bezel-edge);
    border-radius: 16px;
    padding: 28px 24px 24px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.6),
      0 0 1px rgba(255,255,255,0.05) inset,
      0 1px 0 rgba(255,255,255,0.04) inset;
    width: 380px;
    position: relative;
  }

  .brand {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    padding: 0 4px;
  }
  .brand-name {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .brand-model {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #666;
  }

  /* === DISPLAY === */
  .display-bezel {
    background: var(--bezel);
    border: 1px solid #222;
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4) inset;
  }

  .display {
    background: var(--display-bg);
    border-radius: 6px;
    padding: 12px 16px;
    font-family: 'Share Tech Mono', monospace;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(51,255,102,0.05) inset;
  }

  .display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  .stack-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    height: 26px;
    line-height: 26px;
  }
  .stack-label {
    color: var(--display-dim);
    font-size: 12px;
    width: 28px;
    flex-shrink: 0;
  }
  .stack-value {
    color: var(--display-dim);
    font-size: 16px;
    text-align: right;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stack-row:last-child .stack-value,
  .stack-row:last-child .stack-label {
    color: var(--display-glow);
    text-shadow: 0 0 8px rgba(51,255,102,0.4);
  }

  .input-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    height: 30px;
    line-height: 30px;
    border-top: 1px solid rgba(51,255,102,0.1);
    margin-top: 4px;
    padding-top: 4px;
  }
  .input-label {
    color: var(--accent);
    font-size: 11px;
    width: 28px;
    flex-shrink: 0;
    text-shadow: 0 0 6px rgba(255,136,68,0.3);
  }
  .input-value {
    color: var(--display-glow);
    font-size: 20px;
    text-align: right;
    flex: 1;
    text-shadow: 0 0 10px rgba(51,255,102,0.5);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cursor {
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .error-msg {
    position: absolute;
    bottom: 8px;
    right: 16px;
    font-size: 10px;
    color: #ff4444;
    text-shadow: 0 0 4px rgba(255,68,68,0.4);
    z-index: 3;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .error-msg.show { opacity: 1; }

  /* === BUTTONS === */
  .button-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .btn {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--btn-text);
    border: none;
    border-radius: 6px;
    padding: 14px 0;
    cursor: pointer;
    position: relative;
    transition: all 0.1s;
    user-select: none;
    -webkit-user-select: none;
    box-shadow:
      0 3px 0 rgba(0,0,0,0.4),
      0 0 1px rgba(255,255,255,0.06) inset,
      0 1px 0 rgba(255,255,255,0.05) inset;
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  .btn-num { background: var(--btn-num); }
  .btn-num:hover { background: var(--btn-num-hover); }

  .btn-op { background: var(--btn-op); color: var(--accent); }
  .btn-op:hover { background: var(--btn-op-hover); }

  .btn-enter {
    background: var(--btn-enter);
    grid-column: span 2;
    color: var(--display-glow);
    letter-spacing: 2px;
  }
  .btn-enter:hover { background: var(--btn-enter-hover); }

  .btn-func { background: var(--btn-func); font-size: 12px; }
  .btn-func:hover { background: var(--btn-func-hover); }

  .btn-clear { background: var(--btn-clear); }
  .btn-clear:hover { background: var(--btn-clear-hover); }

  .key-hint {
    position: absolute;
    top: 3px;
    right: 5px;
    font-size: 8px;
    color: #555;
    font-weight: 400;
  }

  .help-bar {
    margin-top: 18px;
    text-align: center;
    font-size: 11px;
    color: #444;
    letter-spacing: 0.5px;
  }
  .help-bar kbd {
    display: inline-block;
    background: #222;
    border: 1px solid #333;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: #666;
  }
</style>
</head>
<body>

<div class="calculator" id="calc">
  <div class="brand">
    <span class="brand-name">Retro Future</span>
    <span class="brand-model">RPN-26</span>
  </div>

  <div class="display-bezel">
    <div class="display" id="display">
      <div class="stack-row"><span class="stack-label">T:</span><span class="stack-value" id="reg-t">0</span></div>
      <div class="stack-row"><span class="stack-label">Z:</span><span class="stack-value" id="reg-z">0</span></div>
      <div class="stack-row"><span class="stack-label">Y:</span><span class="stack-value" id="reg-y">0</span></div>
      <div class="stack-row"><span class="stack-label">X:</span><span class="stack-value" id="reg-x">0</span></div>
      <div class="input-row">
        <span class="input-label">IN</span>
        <span class="input-value" id="input-buf"><span class="cursor">_</span></span>
      </div>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <div class="button-grid">
    <!-- Row 1: functions -->
    <button class="btn btn-func" data-action="swap">x↔y</button>
    <button class="btn btn-func" data-action="roll">R↓<span class="key-hint">r</span></button>
    <button class="btn btn-func" data-action="sqrt">√x</button>
    <button class="btn btn-func" data-action="pow">yˣ<span class="key-hint">^</span></button>
    <button class="btn btn-func" data-action="neg">±<span class="key-hint">n</span></button>

    <!-- Row 2 -->
    <button class="btn btn-num" data-digit="7">7</button>
    <button class="btn btn-num" data-digit="8">8</button>
    <button class="btn btn-num" data-digit="9">9</button>
    <button class="btn btn-op" data-action="div">÷<span class="key-hint">/</span></button>
    <button class="btn btn-clear" data-action="clr">CLR<span class="key-hint">c</span></button>

    <!-- Row 3 -->
    <button class="btn btn-num" data-digit="4">4</button>
    <button class="btn btn-num" data-digit="5">5</button>
    <button class="btn btn-num" data-digit="6">6</button>
    <button class="btn btn-op" data-action="mul">×<span class="key-hint">*</span></button>
    <button class="btn btn-func" data-action="drop">DROP<span class="key-hint">d</span></button>

    <!-- Row 4 -->
    <button class="btn btn-num" data-digit="1">1</button>
    <button class="btn btn-num" data-digit="2">2</button>
    <button class="btn btn-num" data-digit="3">3</button>
    <button class="btn btn-op" data-action="sub">−<span class="key-hint">-</span></button>
    <button class="btn btn-func" data-action="dup">DUP</button>

    <!-- Row 5 -->
    <button class="btn btn-num" data-digit="0">0</button>
    <button class="btn btn-num" data-digit=".">.</button>
    <button class="btn btn-enter" data-action="enter">ENTER ↵</button>
    <button class="btn btn-op" data-action="add">+</button>
  </div>
</div>

<div class="help-bar">
  <kbd>0-9</kbd> <kbd>.</kbd> digits &nbsp;
  <kbd>Enter</kbd> push &nbsp;
  <kbd>+-*/^</kbd> ops &nbsp;
  <kbd>Bksp</kbd> delete &nbsp;
  <kbd>Esc</kbd> clear
</div>

<script>
(function() {
  // 4-level stack: T Z Y X  (classic HP style)
  const stack = [0, 0, 0, 0]; // [T, Z, Y, X]
  let inputBuf = '';
  let liftEnabled = true; // after enter/op, next digit pushes stack

  const elT = document.getElementById('reg-t');
  const elZ = document.getElementById('reg-z');
  const elY = document.getElementById('reg-y');
  const elX = document.getElementById('reg-x');
  const elIn = document.getElementById('input-buf');
  const elErr = document.getElementById('error-msg');

  function fmt(n) {
    if (!isFinite(n)) return n > 0 ? '∞' : n < 0 ? '-∞' : 'NaN';
    if (Math.abs(n) > 1e12 || (Math.abs(n) < 1e-6 && n !== 0)) return n.toExponential(6);
    // Remove trailing zeros for clean display
    const s = parseFloat(n.toPrecision(12)).toString();
    return s;
  }

  function render() {
    elT.textContent = fmt(stack[0]);
    elZ.textContent = fmt(stack[1]);
    elY.textContent = fmt(stack[2]);
    elX.textContent = fmt(stack[3]);
    if (inputBuf === '') {
      elIn.innerHTML = '<span class="cursor">_</span>';
    } else {
      elIn.textContent = inputBuf;
    }
  }

  function showError(msg) {
    elErr.textContent = msg;
    elErr.classList.add('show');
    setTimeout(() => elErr.classList.remove('show'), 1500);
  }

  function pushStack(val) {
    // T is lost, everything shifts up
    stack[0] = stack[1];
    stack[1] = stack[2];
    stack[2] = stack[3];
    stack[3] = val;
  }

  function commitInput() {
    // If there's something in the buffer, push it to X (with stack lift if needed)
    if (inputBuf !== '') {
      const val = parseFloat(inputBuf);
      if (isNaN(val)) { showError('Bad number'); return false; }
      if (liftEnabled) {
        pushStack(val);
      } else {
        stack[3] = val;
      }
      inputBuf = '';
      liftEnabled = true;
      return true;
    }
    return true;
  }

  function enterDigit(ch) {
    // Prevent multiple dots
    if (ch === '.' && inputBuf.includes('.')) return;
    // Prevent leading zeros (allow "0.")
    if (ch === '0' && inputBuf === '0') return;
    if (ch !== '.' && ch !== '0' && inputBuf === '0') inputBuf = '';

    if (inputBuf === '' && liftEnabled) {
      // About to start typing a new number — lift stack
    }
    inputBuf += ch;
    render();
  }

  function backspace() {
    if (inputBuf.length > 0) {
      inputBuf = inputBuf.slice(0, -1);
      render();
    }
  }

  function doEnter() {
    if (inputBuf !== '') {
      commitInput();
    } else {
      // Duplicate X
      pushStack(stack[3]);
    }
    liftEnabled = false; // next digit replaces X
    render();
  }

  function binaryOp(fn) {
    commitInput();
    const x = stack[3];
    const y = stack[2];
    const result = fn(y, x);
    // Drop: pull stack down
    stack[3] = result;
    stack[2] = stack[1];
    stack[1] = stack[0];
    stack[0] = stack[0]; // T replicates
    liftEnabled = true;
    render();
  }

  function unaryOp(fn) {
    commitInput();
    const result = fn(stack[3]);
    if (result === undefined) return;
    stack[3] = result;
    liftEnabled = true;
    render();
  }

  function doAction(action) {
    switch(action) {
      case 'add': binaryOp((y,x) => y + x); break;
      case 'sub': binaryOp((y,x) => y - x); break;
      case 'mul': binaryOp((y,x) => y * x); break;
      case 'div':
        if (stack[3] === 0 && inputBuf === '') { showError('÷ by zero'); return; }
        binaryOp((y,x) => { if(x===0){showError('÷ by zero'); return y;} return y/x; });
        break;
      case 'pow': binaryOp((y,x) => Math.pow(y,x)); break;
      case 'sqrt':
        commitInput();
        if (stack[3] < 0) { showError('√ of negative'); return; }
        unaryOp(x => Math.sqrt(x));
        break;
      case 'neg':
        if (inputBuf !== '') {
          if (inputBuf.startsWith('-')) inputBuf = inputBuf.slice(1);
          else inputBuf = '-' + inputBuf;
          render();
        } else {
          stack[3] = -stack[3];
          render();
        }
        break;
      case 'swap':
        commitInput();
        const tmp = stack[3];
        stack[3] = stack[2];
        stack[2] = tmp;
        render();
        break;
      case 'roll':
        commitInput();
        const x = stack[3];
        stack[3] = stack[2];
        stack[2] = stack[1];
        stack[1] = stack[0];
        stack[0] = x;
        render();
        break;
      case 'drop':
        inputBuf = '';
        stack[3] = stack[2];
        stack[2] = stack[1];
        stack[1] = stack[0];
        // T replicates
        render();
        break;
      case 'dup':
        commitInput();
        pushStack(stack[3]);
        render();
        break;
      case 'clr':
        inputBuf = '';
        stack[0] = stack[1] = stack[2] = stack[3] = 0;
        liftEnabled = true;
        render();
        break;
      case 'enter': doEnter(); break;
    }
  }

  // Button clicks
  document.querySelector('.button-grid').addEventListener('click', (e) => {
    const btn = e.target.closest('.btn');
    if (!btn) return;
    if (btn.dataset.digit !== undefined) enterDigit(btn.dataset.digit);
    else if (btn.dataset.action) doAction(btn.dataset.action);
  });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    // Prevent default for keys we handle
    const key = e.key;

    if (key >= '0' && key <= '9') { e.preventDefault(); enterDigit(key); }
    else if (key === '.') { e.preventDefault(); enterDigit('.'); }
    else if (key === 'Enter') { e.preventDefault(); doEnter(); }
    else if (key === '+') { e.preventDefault(); doAction('add'); }
    else if (key === '-') { e.preventDefault(); doAction('sub'); }
    else if (key === '*') { e.preventDefault(); doAction('mul'); }
    else if (key === '/') { e.preventDefault(); doAction('div'); }
    else if (key === '^') { e.preventDefault(); doAction('pow'); }
    else if (key === 'Backspace') { e.preventDefault(); backspace(); }
    else if (key === 'Escape') { e.preventDefault(); doAction('clr'); }
    else if (key === 'n' || key === 'N') { e.preventDefault(); doAction('neg'); }
    else if (key === 'r' || key === 'R') { e.preventDefault(); doAction('roll'); }
    else if (key === 'd' || key === 'D') { e.preventDefault(); doAction('drop'); }
    else if (key === 's' || key === 'S') { e.preventDefault(); doAction('swap'); }
    else if (key === 'q' || key === 'Q') { e.preventDefault(); doAction('sqrt'); }
    else if (key === 'Delete') { e.preventDefault(); doAction('clr'); }
  });

  render();
})();
</script>
</body>
</html>
