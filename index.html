<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPN Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Chakra+Petch:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --calc-bg: #1a1a1e;
    --bezel: #2a2a30;
    --bezel-edge: #3a3a42;
    --display-bg: #0a1a0a;
    --display-glow: #33ff66;
    --display-dim: #1a7733;
    --btn-num: #3a3a44;
    --btn-num-hover: #4a4a55;
    --btn-op: #4a3a2a;
    --btn-op-hover: #5a4a3a;
    --btn-enter: #2a4a3a;
    --btn-enter-hover: #3a5a4a;
    --btn-func: #2a2a3a;
    --btn-func-hover: #3a3a4a;
    --btn-sci: #2a3340;
    --btn-sci-hover: #354150;
    --btn-clear: #5a2a2a;
    --btn-clear-hover: #6a3a3a;
    --btn-text: #e0e0e0;
    --btn-label: #aaa;
    --accent: #ff8844;
    --shadow: rgba(0,0,0,0.5);
  }

  body {
    background: #111114;
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(51,255,102,0.03) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(255,136,68,0.03) 0%, transparent 60%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Chakra Petch', sans-serif;
    color: #ccc;
  }

  .calculator {
    background: var(--calc-bg);
    border: 1px solid var(--bezel-edge);
    border-radius: 16px;
    padding: 28px 24px 24px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.6),
      0 0 1px rgba(255,255,255,0.05) inset,
      0 1px 0 rgba(255,255,255,0.04) inset;
    width: 380px;
    position: relative;
  }

  .brand {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    padding: 0 4px;
  }
  .brand-name {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .brand-model {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #666;
  }

  /* === DISPLAY === */
  .display-bezel {
    background: var(--bezel);
    border: 1px solid #222;
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4) inset;
  }

  .display {
    background: var(--display-bg);
    border-radius: 6px;
    padding: 12px 16px;
    font-family: 'Share Tech Mono', monospace;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(51,255,102,0.05) inset;
  }

  .display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  .stack-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    height: 26px;
    line-height: 26px;
  }
  .stack-label {
    color: var(--display-dim);
    font-size: 12px;
    width: 28px;
    flex-shrink: 0;
  }
  .stack-value {
    color: var(--display-dim);
    font-size: 16px;
    text-align: right;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stack-row:last-child .stack-value,
  .stack-row:last-child .stack-label {
    color: var(--display-glow);
    text-shadow: 0 0 8px rgba(51,255,102,0.4);
  }

  .input-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    height: 30px;
    line-height: 30px;
    border-top: 1px solid rgba(51,255,102,0.1);
    margin-top: 4px;
    padding-top: 4px;
  }
  .input-label {
    color: var(--accent);
    font-size: 11px;
    width: 28px;
    flex-shrink: 0;
    text-shadow: 0 0 6px rgba(255,136,68,0.3);
  }
  .input-value {
    color: var(--display-glow);
    font-size: 20px;
    text-align: right;
    flex: 1;
    text-shadow: 0 0 10px rgba(51,255,102,0.5);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cursor {
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .error-msg {
    position: absolute;
    bottom: 8px;
    right: 16px;
    font-size: 10px;
    color: #ff4444;
    text-shadow: 0 0 4px rgba(255,68,68,0.4);
    z-index: 3;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .error-msg.show { opacity: 1; }

  .mode-indicator {
    position: absolute;
    top: 6px;
    left: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--accent);
    letter-spacing: 1px;
    text-shadow: 0 0 4px rgba(255,136,68,0.4);
    z-index: 3;
  }

  /* === BUTTONS === */
  .button-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .btn {
    font-family: 'Chakra Petch', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--btn-text);
    border: none;
    border-radius: 6px;
    padding: 14px 0;
    cursor: pointer;
    position: relative;
    transition: all 0.1s;
    user-select: none;
    -webkit-user-select: none;
    box-shadow:
      0 3px 0 rgba(0,0,0,0.4),
      0 0 1px rgba(255,255,255,0.06) inset,
      0 1px 0 rgba(255,255,255,0.05) inset;
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  .btn-num { background: var(--btn-num); }
  .btn-num:hover { background: var(--btn-num-hover); }

  .btn-op { background: var(--btn-op); color: var(--accent); }
  .btn-op:hover { background: var(--btn-op-hover); }

  .btn-enter {
    background: var(--btn-enter);
    grid-column: span 2;
    color: var(--display-glow);
    letter-spacing: 2px;
  }
  .btn-enter:hover { background: var(--btn-enter-hover); }

  .btn-func { background: var(--btn-func); font-size: 12px; }
  .btn-func:hover { background: var(--btn-func-hover); }

  .btn-sci {
    background: var(--btn-sci);
    font-size: 11px;
    color: #b8d4e8;
    letter-spacing: 0.5px;
  }
  .btn-sci:hover { background: var(--btn-sci-hover); }

  .btn-clear { background: var(--btn-clear); }
  .btn-clear:hover { background: var(--btn-clear-hover); }

  .key-hint {
    position: absolute;
    top: 3px;
    right: 5px;
    font-size: 8px;
    color: #555;
    font-weight: 400;
  }

  .help-bar {
    margin-top: 18px;
    text-align: center;
    font-size: 11px;
    color: #444;
    letter-spacing: 0.5px;
  }
  .help-bar kbd {
    display: inline-block;
    background: #222;
    border: 1px solid #333;
    border-radius: 3px;
    padding: 1px 5px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: #666;
  }
</style>
</head>
<body>

<div class="calculator" id="calc">
  <div class="brand">
    <span class="brand-name">Retro Future</span>
    <span class="brand-model">RPL-48</span>
  </div>

  <div class="display-bezel">
    <div class="display" id="display">
      <div class="mode-indicator" id="mode-ind">DEG</div>
      <div class="stack-row"><span class="stack-label">4:</span><span class="stack-value" id="reg-4"></span></div>
      <div class="stack-row"><span class="stack-label">3:</span><span class="stack-value" id="reg-3"></span></div>
      <div class="stack-row"><span class="stack-label">2:</span><span class="stack-value" id="reg-2"></span></div>
      <div class="stack-row"><span class="stack-label">1:</span><span class="stack-value" id="reg-1"></span></div>
      <div class="input-row">
        <span class="input-label">&gt;</span>
        <span class="input-value" id="input-buf"><span class="cursor">_</span></span>
      </div>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <div class="button-grid">
    <!-- Row 1: trig and log -->
    <button class="btn btn-sci" data-action="sin">SIN</button>
    <button class="btn btn-sci" data-action="cos">COS</button>
    <button class="btn btn-sci" data-action="tan">TAN</button>
    <button class="btn btn-sci" data-action="ln">LN</button>
    <button class="btn btn-sci" data-action="exp">eˣ</button>

    <!-- Row 2: inverse trig and log -->
    <button class="btn btn-sci" data-action="asin">SIN⁻¹</button>
    <button class="btn btn-sci" data-action="acos">COS⁻¹</button>
    <button class="btn btn-sci" data-action="atan">TAN⁻¹</button>
    <button class="btn btn-sci" data-action="log">LOG</button>
    <button class="btn btn-sci" data-action="alog">10ˣ</button>

    <!-- Row 3: constants and unary -->
    <button class="btn btn-sci" data-action="pi">π</button>
    <button class="btn btn-sci" data-action="e">e</button>
    <button class="btn btn-sci" data-action="inv">1/x</button>
    <button class="btn btn-sci" data-action="sqr">x²</button>
    <button class="btn btn-sci" data-action="mode" id="mode-btn">DEG</button>

    <!-- Row 4: stack ops -->
    <button class="btn btn-func" data-action="swap">SWAP<span class="key-hint">s</span></button>
    <button class="btn btn-func" data-action="roll">R↓<span class="key-hint">r</span></button>
    <button class="btn btn-func" data-action="sqrt">√x<span class="key-hint">q</span></button>
    <button class="btn btn-func" data-action="pow">yˣ<span class="key-hint">^</span></button>
    <button class="btn btn-func" data-action="neg">±<span class="key-hint">n</span></button>

    <!-- Row 5 -->
    <button class="btn btn-num" data-digit="7">7</button>
    <button class="btn btn-num" data-digit="8">8</button>
    <button class="btn btn-num" data-digit="9">9</button>
    <button class="btn btn-op" data-action="div">÷<span class="key-hint">/</span></button>
    <button class="btn btn-clear" data-action="clr">CLR<span class="key-hint">c</span></button>

    <!-- Row 6 -->
    <button class="btn btn-num" data-digit="4">4</button>
    <button class="btn btn-num" data-digit="5">5</button>
    <button class="btn btn-num" data-digit="6">6</button>
    <button class="btn btn-op" data-action="mul">×<span class="key-hint">*</span></button>
    <button class="btn btn-func" data-action="drop">DROP<span class="key-hint">d</span></button>

    <!-- Row 7 -->
    <button class="btn btn-num" data-digit="1">1</button>
    <button class="btn btn-num" data-digit="2">2</button>
    <button class="btn btn-num" data-digit="3">3</button>
    <button class="btn btn-op" data-action="sub">−<span class="key-hint">-</span></button>
    <button class="btn btn-func" data-action="dup">DUP</button>

    <!-- Row 8 -->
    <button class="btn btn-num" data-digit="0">0</button>
    <button class="btn btn-num" data-digit=".">.</button>
    <button class="btn btn-enter" data-action="enter">ENTER ↵</button>
    <button class="btn btn-op" data-action="add">+</button>
  </div>
</div>

<div class="help-bar">
  <kbd>0-9</kbd> <kbd>.</kbd> digits &nbsp;
  <kbd>Enter</kbd> push &nbsp;
  <kbd>+-*/^</kbd> ops &nbsp;
  <kbd>Bksp</kbd> delete &nbsp;
  <kbd>Esc</kbd> clear
</div>

<script>
(function() {
  // HP-48 / RPL stack: unbounded, stack[0] = level 1 (bottom, most recent)
  let stack = [];
  let inputBuf = '';
  let angleMode = 'DEG'; // 'DEG' or 'RAD'

  const elL1 = document.getElementById('reg-1');
  const elL2 = document.getElementById('reg-2');
  const elL3 = document.getElementById('reg-3');
  const elL4 = document.getElementById('reg-4');
  const elIn = document.getElementById('input-buf');
  const elErr = document.getElementById('error-msg');
  const elMode = document.getElementById('mode-ind');
  const elModeBtn = document.getElementById('mode-btn');

  // Convert input angle to radians based on mode
  function toRad(a) { return angleMode === 'DEG' ? a * Math.PI / 180 : a; }
  // Convert radians result back to mode
  function fromRad(a) { return angleMode === 'DEG' ? a * 180 / Math.PI : a; }

  function fmt(n) {
    if (n === undefined) return '';
    if (!isFinite(n)) return n > 0 ? '∞' : n < 0 ? '-∞' : 'NaN';
    if (n === 0) return '0';
    if (Math.abs(n) > 1e12 || Math.abs(n) < 1e-6) return n.toExponential(6);
    return parseFloat(n.toPrecision(12)).toString();
  }

  function render() {
    // Show top 4 visible levels; level 1 is the most recent push (stack end).
    elL1.textContent = fmt(stack[stack.length - 1]);
    elL2.textContent = fmt(stack[stack.length - 2]);
    elL3.textContent = fmt(stack[stack.length - 3]);
    elL4.textContent = fmt(stack[stack.length - 4]);
    if (inputBuf === '') {
      elIn.innerHTML = '<span class="cursor">_</span>';
    } else {
      elIn.textContent = inputBuf;
    }
  }

  function showError(msg) {
    elErr.textContent = msg;
    elErr.classList.add('show');
    setTimeout(() => elErr.classList.remove('show'), 1500);
  }

  // ---- Input buffer (command line) ----

  function enterDigit(ch) {
    // Prevent multiple dots
    if (ch === '.' && inputBuf.includes('.')) return;
    // Replace single leading zero when typing a non-dot digit
    if (inputBuf === '0' && ch !== '.') inputBuf = '';
    inputBuf += ch;
    render();
  }

  function backspace() {
    if (inputBuf.length > 0) {
      inputBuf = inputBuf.slice(0, -1);
      render();
    } else if (stack.length > 0) {
      // HP-48: backspace with empty command line drops level 1
      stack.pop();
      render();
    }
  }

  // commitInput pushes the buffer onto the stack as a new level.
  // Returns true if a value was committed (or buffer was empty - no-op success).
  function commitInput() {
    if (inputBuf === '') return true;
    const val = parseFloat(inputBuf);
    if (isNaN(val)) { showError('Bad number'); inputBuf = ''; render(); return false; }
    stack.push(val);
    inputBuf = '';
    return true;
  }

  // ---- Operations ----

  function doEnter() {
    if (inputBuf !== '') {
      // Terminate the command line and push onto the stack
      commitInput();
    } else if (stack.length > 0) {
      // Empty command line: DUP level 1
      stack.push(stack[stack.length - 1]);
    }
    render();
  }

  function needArgs(n) {
    // After committing input, do we have enough on the stack?
    const available = stack.length + (inputBuf !== '' ? 1 : 0);
    if (available < n) {
      showError('Too few args');
      return false;
    }
    return true;
  }

  function binaryOp(fn, name) {
    if (!needArgs(2)) return;
    if (!commitInput()) return;
    const x = stack.pop(); // level 1 (right operand)
    const y = stack.pop(); // level 2 (left operand)
    const result = fn(y, x);
    if (result === null) {
      // Op rejected — restore operands
      stack.push(y);
      stack.push(x);
      return;
    }
    stack.push(result);
    render();
  }

  function unaryOp(fn) {
    if (!needArgs(1)) return;
    if (!commitInput()) return;
    const x = stack.pop();
    const result = fn(x);
    if (result === null) {
      stack.push(x);
      return;
    }
    stack.push(result);
    render();
  }

  function doAction(action) {
    switch(action) {
      case 'add': binaryOp((y,x) => y + x); break;
      case 'sub': binaryOp((y,x) => y - x); break;
      case 'mul': binaryOp((y,x) => y * x); break;
      case 'div': {
        // Check divisor before mutating state
        const divisor = inputBuf !== '' ? parseFloat(inputBuf) : stack[stack.length - 1];
        if (divisor === 0) { showError('÷ by zero'); return; }
        binaryOp((y,x) => y / x);
        break;
      }
      case 'pow': binaryOp((y,x) => Math.pow(y,x)); break;
      case 'sqrt': {
        const operand = inputBuf !== '' ? parseFloat(inputBuf) : stack[stack.length - 1];
        if (operand < 0) { showError('√ of negative'); return; }
        unaryOp(x => Math.sqrt(x));
        break;
      }
      case 'neg':
        if (inputBuf !== '') {
          if (inputBuf.startsWith('-')) inputBuf = inputBuf.slice(1);
          else inputBuf = '-' + inputBuf;
          render();
        } else if (stack.length > 0) {
          stack[stack.length - 1] = -stack[stack.length - 1];
          render();
        }
        break;
      case 'swap': {
        if (!needArgs(2)) return;
        if (!commitInput()) return;
        const a = stack.pop();
        const b = stack.pop();
        stack.push(a);
        stack.push(b);
        render();
        break;
      }
      case 'roll': {
        // ROLLDOWN (R↓): top goes to the bottom of visible stack;
        // i.e. level 1 -> deepest, others move up. We'll do classic R↓:
        // pop level 1, unshift it to position 0 (deepest).
        commitInput();
        if (stack.length < 2) { render(); return; }
        const top = stack.pop();
        stack.unshift(top);
        render();
        break;
      }
      case 'drop':
        // DROP: discards the command line if present, else pops level 1
        if (inputBuf !== '') {
          inputBuf = '';
        } else if (stack.length > 0) {
          stack.pop();
        }
        render();
        break;
      case 'dup':
        if (inputBuf !== '') {
          // Commit then dup
          if (!commitInput()) return;
        }
        if (stack.length > 0) {
          stack.push(stack[stack.length - 1]);
        }
        render();
        break;
      case 'clr':
        inputBuf = '';
        stack = [];
        render();
        break;
      case 'enter': doEnter(); break;

      // ---- Scientific functions ----
      case 'sin':  unaryOp(x => Math.sin(toRad(x))); break;
      case 'cos':  unaryOp(x => Math.cos(toRad(x))); break;
      case 'tan':  unaryOp(x => Math.tan(toRad(x))); break;
      case 'asin': {
        const operand = inputBuf !== '' ? parseFloat(inputBuf) : stack[stack.length - 1];
        if (operand < -1 || operand > 1) { showError('asin out of range'); return; }
        unaryOp(x => fromRad(Math.asin(x)));
        break;
      }
      case 'acos': {
        const operand = inputBuf !== '' ? parseFloat(inputBuf) : stack[stack.length - 1];
        if (operand < -1 || operand > 1) { showError('acos out of range'); return; }
        unaryOp(x => fromRad(Math.acos(x)));
        break;
      }
      case 'atan': unaryOp(x => fromRad(Math.atan(x))); break;
      case 'ln': {
        const operand = inputBuf !== '' ? parseFloat(inputBuf) : stack[stack.length - 1];
        if (operand <= 0) { showError('ln of non-positive'); return; }
        unaryOp(x => Math.log(x));
        break;
      }
      case 'log': {
        const operand = inputBuf !== '' ? parseFloat(inputBuf) : stack[stack.length - 1];
        if (operand <= 0) { showError('log of non-positive'); return; }
        unaryOp(x => Math.log10(x));
        break;
      }
      case 'exp':  unaryOp(x => Math.exp(x)); break;
      case 'alog': unaryOp(x => Math.pow(10, x)); break;
      case 'inv': {
        const operand = inputBuf !== '' ? parseFloat(inputBuf) : stack[stack.length - 1];
        if (operand === 0) { showError('1 ÷ 0'); return; }
        unaryOp(x => 1 / x);
        break;
      }
      case 'sqr': unaryOp(x => x * x); break;
      case 'pi': {
        // Commit any pending entry, then push π (HP-48 behavior)
        if (!commitInput()) return;
        stack.push(Math.PI);
        render();
        break;
      }
      case 'e': {
        if (!commitInput()) return;
        stack.push(Math.E);
        render();
        break;
      }
      case 'mode':
        angleMode = (angleMode === 'DEG') ? 'RAD' : 'DEG';
        elMode.textContent = angleMode;
        elModeBtn.textContent = angleMode;
        break;
    }
  }

  // ---- Event wiring ----

  document.querySelector('.button-grid').addEventListener('click', (e) => {
    const btn = e.target.closest('.btn');
    if (!btn) return;
    if (btn.dataset.digit !== undefined) enterDigit(btn.dataset.digit);
    else if (btn.dataset.action) doAction(btn.dataset.action);
  });

  document.addEventListener('keydown', (e) => {
    const key = e.key;
    if (key >= '0' && key <= '9') { e.preventDefault(); enterDigit(key); }
    else if (key === '.') { e.preventDefault(); enterDigit('.'); }
    else if (key === 'Enter') { e.preventDefault(); doEnter(); }
    else if (key === '+') { e.preventDefault(); doAction('add'); }
    else if (key === '-') { e.preventDefault(); doAction('sub'); }
    else if (key === '*') { e.preventDefault(); doAction('mul'); }
    else if (key === '/') { e.preventDefault(); doAction('div'); }
    else if (key === '^') { e.preventDefault(); doAction('pow'); }
    else if (key === 'Backspace') { e.preventDefault(); backspace(); }
    else if (key === 'Escape') { e.preventDefault(); doAction('clr'); }
    else if (key === 'n' || key === 'N') { e.preventDefault(); doAction('neg'); }
    else if (key === 'r' || key === 'R') { e.preventDefault(); doAction('roll'); }
    else if (key === 'd' || key === 'D') { e.preventDefault(); doAction('drop'); }
    else if (key === 's' || key === 'S') { e.preventDefault(); doAction('swap'); }
    else if (key === 'q' || key === 'Q') { e.preventDefault(); doAction('sqrt'); }
    else if (key === 'Delete') { e.preventDefault(); doAction('clr'); }
  });

  render();
})();
</script>
</body>
</html>
